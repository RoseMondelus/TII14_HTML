<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>operadores aritmaticos</title>
</head>
<body>
    
<script>

    // operadores relacionais
    // operadores são usados para comparar dois valores e retornam um valor lógico (verdadeiro ou falso)

     let num1 = 35;
     let num2 = 5;

    // igual a (==): verifica se dois valores são iguais
        let igualdade = num1 == num2;
        console.log(igualdade)
        console.log(5 == "5") //true ( a string "5" é convertida para N 5)
        console.log(true == 1) // true (true é convertido para 1)
        console.log(false == 0) //true (false é convertido para 0)
        console.log(null == undefined)

     //true (ambos são considerados iguais em comparação soltas)
    // igualdade a (===): Verifica se dois valores são iguais e do mesmo tipo

        let igualdadeValorTipo = num1 === num2;
        console.log(igualdadeValorTipo)
        console.log(5 == "5") // false
        console.log(true == 1) // false
        console.log(false == 0) // false
        console.log(null == undefined) // false

    // diferente de (!=): verifica se dois valores são diferentes
        console.log(5!= "5") // false
        console.log(true != 1) // false

    // diferente de (!==): verifica se dois valores são diferentes e do mesmo tipo
        console.log(5!== "5") // true
        console.log(true !== 1) // true


    // Maior que (>):verifica se um valor é maior que outro
        console.log(5 > 6) //false
        console.log(69 > 67) //true
        console.log(5 > 5) //false

    // menor que (<): verifica se um valor é menor que o outro
        console.log(5 < 6) //true
        console.log(69 < 67) //false
        console.log(5 < 5) //true

    //Maior ou igual (>=) verifica se um valor é maior ou igual que outro
        console.log(5 >= 6) //false
        console.log(69 >= 67) //false
        console.log(5 >= 5) //true



</script>

</body>

</html>
